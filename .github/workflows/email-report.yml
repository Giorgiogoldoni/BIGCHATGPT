name: Email report BIGCHATGPT

on:
  workflow_run:
    workflows: ["Aggiorna BIGCHATGPT"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  send-report:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il report prodotto dal run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          path: ./pages-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Estrae i dati del bollettino
        run: |
          mkdir -p ./site
          if [ -f ./pages-artifact/artifact.tar ]; then
            tar -xf ./pages-artifact/artifact.tar -C ./site
          elif [ -f ./pages-artifact/data/bollettino.json ]; then
            cp -r ./pages-artifact/. ./site/
          fi
          test -f ./site/data/bollettino.json && echo "Bollettino disponibile" || echo "Bollettino non trovato nell'artifact"

      - name: Invia bollettino operativo via email
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: giorgiorgio.goldoni.me@gmail.com
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import os, json, smtplib, html, re
          from pathlib import Path
          from email.message import EmailMessage
          from datetime import datetime
          from zoneinfo import ZoneInfo

          username = os.environ["MAIL_USERNAME"]
          password = os.environ["MAIL_APP_PASSWORD"]
          recipient = os.environ["MAIL_TO"]
          conclusion = os.environ["RUN_CONCLUSION"]
          run_url = os.environ["RUN_URL"]
          updated = datetime.fromisoformat(os.environ["RUN_UPDATED_AT"].replace("Z", "+00:00"))
          local_time = updated.astimezone(ZoneInfo("Europe/Rome")).strftime("%d/%m/%Y alle %H:%M")
          ok = conclusion == "success"
          status = "COMPLETATO CON SUCCESSO" if ok else f"TERMINATO CON ESITO: {conclusion.upper()}"
          subject = f"BIGCHATGPT — bollettino operativo {status}"

          lines = [
              "BIGCHATGPT — BOLLETTINO OPERATIVO",
              f"Aggiornamento: {local_time} (ora italiana)",
              f"Run: #{os.environ['RUN_NUMBER']} · Commit: {os.environ['RUN_HEAD_SHA'][:12]}",
              "",
          ]

          report_path = Path("site/data/bollettino.json")
          if report_path.exists():
              data = json.loads(report_path.read_text(encoding="utf-8"))
              lines += [
                  f"QUADRO DI MERCATO — {data.get('date', 'data n.d.')}",
                  f"Regime: {data.get('risk_label', 'n.d.')} · VIX: {data.get('vix', 'n.d.')}",
                  data.get("risk_text", ""),
                  data.get("summary", ""),
                  "",
                  "SELEZIONI E MOTIVAZIONI",
              ]
              actions = {"ACQUISTARE": [], "MANTENERE": [], "RIDURRE / EVITARE": [], "ATTENDERE": []}
              seen = set()
              for area in data.get("areas", []):
                  # Prima i BUY confermati su tutto l'universo dell'area, poi i migliori 5 per score.
                  candidates = area.get("buy_candidates", []) + area.get("leaders", [])
                  for row in candidates:
                      ticker = row.get("ticker")
                      if not ticker or ticker in seen:
                          continue
                      seen.add(ticker)
                      trend = row.get("trend")
                      rel = row.get("trend_rs")
                      stress = row.get("stress_score")
                      strict_buy = (
                          row.get("buy_level") == "BUY" and trend == "VERDE" and rel == "VERDE"
                          and row.get("mm_aligned") is True and row.get("sar_bullish") is True
                          and row.get("vortex_bullish") is True and row.get("rvi_bullish") is True
                          and isinstance(stress, (int, float)) and stress <= 1
                      )
                      if strict_buy:
                          label = "ACQUISTARE"
                          why = "BUY confermato: trend e forza relativa verdi, medie allineate, SAR/Vortex/RVI rialzisti e stress contenuto."
                      elif trend == "ROSSO" and rel == "ROSSO":
                          label = "RIDURRE / EVITARE"
                          why = "Trend e forza relativa entrambi rossi: configurazione debole, non adatta a nuovi ingressi."
                      elif trend == "VERDE" and rel == "VERDE":
                          label = "MANTENERE"
                          missing = []
                          if row.get("buy_level") != "BUY": missing.append("manca un trigger BUY")
                          if row.get("mm_aligned") is not True: missing.append("medie non allineate")
                          if row.get("sar_bullish") is not True: missing.append("SAR non rialzista")
                          if row.get("vortex_bullish") is not True: missing.append("Vortex non rialzista")
                          if row.get("rvi_bullish") is not True: missing.append("RVI non rialzista")
                          if not isinstance(stress, (int, float)) or stress > 1: missing.append("stress oltre soglia")
                          why = "Trend e forza relativa positivi; " + (", ".join(missing) if missing else "segnale positivo ma non classificato come nuovo acquisto") + "."
                      else:
                          label = "ATTENDERE"
                          why = f"Conferme non concordi: trend {trend or 'n.d.'}, forza relativa {rel or 'n.d.'}, livello {row.get('buy_level') or 'n.d.'}."
                      actions[label].append((ticker, row, why, area.get("name", "")))

              for label in ("ACQUISTARE", "MANTENERE", "RIDURRE / EVITARE", "ATTENDERE"):
                  items = actions[label]
                  lines += ["", f"{label} ({len(items)})"]
                  if not items:
                      lines.append("Nessuno strumento selezionato.")
                  for ticker, row, why, area_name in items:
                      lines.append(
                          f"- {ticker} — {row.get('name') or ticker} [{area_name}]"
                          f" | Score {row.get('score', 'n.d.')}"
                          f" | Trend {row.get('trend', 'n.d.')}"
                          f" | RS {row.get('trend_rs', 'n.d.')}"
                      )
                      lines.append(f"  Motivo: {why}")
                      lines.append(
                          f"  Dati: perf. 7 sedute {row.get('perf7', 'n.d.')}%; "
                          f"30 sedute {row.get('perf30', 'n.d.')}%; RSI {row.get('rsi', 'n.d.')}; "
                          f"ADX {row.get('adx', 'n.d.')}; stress {row.get('stress_score', 'n.d.')}"
                      )

              # Universo Global: monitoraggio separato dalle sei aree geografiche.
              def append_monitor_section(title, rows, empty_text):
                  lines.extend(["", f"{title} ({len(rows)})"])
                  if not rows:
                      lines.append(empty_text)
                      return
                  for row in rows:
                      ticker = row.get("ticker") or "n.d."
                      trend = row.get("trend") or "n.d."
                      rel = row.get("trend_rs") or "n.d."
                      level = row.get("buy_level") or "n.d."
                      if trend == "VERDE" and rel == "VERDE" and level == "BUY":
                          reading = "Configurazione positiva con livello BUY: verificare comunque tutti i filtri operativi."
                      elif trend == "ROSSO" and rel == "ROSSO":
                          reading = "Trend e forza relativa deboli: evitare nuovi ingressi."
                      elif trend == "VERDE" and rel == "VERDE":
                          reading = "Trend e forza relativa positivi, ma manca una conferma completa di acquisto."
                      else:
                          reading = f"Segnali non concordi: trend {trend}, forza relativa {rel}, livello {level}."
                      lines.append(
                          f"- {ticker} — {row.get('name') or ticker}"
                          f" | Score {row.get('score', 'n.d.')}"
                          f" | Trend {trend} | RS {rel} | Livello {level}"
                      )
                      lines.append(f"  Lettura: {reading}")
                      lines.append(
                          f"  Dati: perf. 7 sedute {row.get('perf7', 'n.d.')}%; "
                          f"30 sedute {row.get('perf30', 'n.d.')}%; RSI {row.get('rsi', 'n.d.')}; "
                          f"ADX {row.get('adx', 'n.d.')}; stress {row.get('stress_score', 'n.d.')}"
                      )

              append_monitor_section(
                  "UNIVERSO GLOBAL — ETF mondiali", data.get("global", []),
                  "Nessun ETF Global presente nel feed geografico."
              )
              append_monitor_section(
                  "FATTORI E STILI — monitoraggio separato", data.get("factors", []),
                  "Nessun ETF fattoriale presente nel feed geografico."
              )

              lines += [
                  "",
                  "CONTESTO PER AREA",
              ]
              for area in data.get("areas", []):
                  lines.append(f"- {area.get('name')}: {area.get('stance')} — {area.get('reason')}")
              top = (data.get("top20") or {}).get("rows", [])[:5]
              lines += ["", "TOP 5 SCORE TECNICO (classifica, non segnale automatico di acquisto)"]
              if top:
                  for row in top:
                      lines.append(f"- {row.get('t')} — score {row.get('score')} | ROC20 {row.get('roc20')}% | RSI {row.get('rsi14')} | ADX {row.get('adx14')}")
              else:
                  lines.append("Classifica non disponibile.")
              lines += [
                  "",
                  "Nota: le indicazioni sono filtri quantitativi descrittivi, non ordini automatici. "
                  "ACQUISTARE richiede la confluenza completa dei filtri; MANTENERE indica trend positivo ma non un nuovo trigger; "
                  "RIDURRE/EVITARE richiede trend e forza relativa entrambi rossi; ATTENDERE segnala dati discordanti.",
              ]
          elif not ok:
              lines += [
                  "ATTENZIONE: aggiornamento non riuscito.",
                  "Non considerare aggiornati i segnali e le selezioni. Verificare il workflow prima di prendere decisioni.",
              ]
          else:
              lines += [
                  "ATTENZIONE: aggiornamento completato ma il file del bollettino non è presente nell'artifact.",
                  "Nessuna selezione è stata inventata o ricostruita da dati precedenti.",
              ]

          lines += [
              "",
              "Bollettino completo e grafici: https://giorgiogoldoni.github.io/BIGCHATGPT/bollettino.html",
              f"Dettaglio tecnico del run: {run_url}",
              "",
              "Email automatica BIGCHATGPT.",
          ]
          msg = EmailMessage()
          msg["From"] = username
          msg["To"] = recipient
          msg["Subject"] = subject
          plain_body = "\n".join(lines)
          msg.set_content(plain_body)

          # Versione HTML: titoli, sezioni colorate e schede ETF leggibili anche da mobile.
          html_parts = ["""<html><body style="margin:0;padding:20px;background:#f3f5f7;font-family:Arial,sans-serif;color:#202124;">
          <div style="max-width:760px;margin:auto;background:#ffffff;padding:24px;border-radius:12px;">
          <h1 style="font-size:22px;margin:0 0 8px;color:#17365d;">BIGCHATGPT — Bollettino operativo</h1>"""]
          for line in lines[1:]:
              if not line.strip():
                  continue
              safe = html.escape(line)
              if line.startswith(("QUADRO DI MERCATO", "SELEZIONI E MOTIVAZIONI", "UNIVERSO GLOBAL", "FATTORI E STILI", "CONTESTO PER AREA", "TOP 5 SCORE")):
                  html_parts.append(f'<h2 style="font-size:17px;color:#17365d;border-bottom:2px solid #dce4ee;padding-bottom:7px;margin:24px 0 12px;">{safe}</h2>')
              elif re.match(r"^(ACQUISTARE|MANTENERE|RIDURRE / EVITARE|ATTENDERE) \(\d+\)$", line):
                  html_parts.append(f'<h3 style="font-size:15px;margin:18px 0 10px;padding:9px 12px;background:#eaf0f7;border-radius:6px;color:#17365d;">{safe}</h3>')
              elif line.startswith("- ") and " | Score " in line:
                  html_parts.append(f'<div style="margin:12px 0 0;padding:13px;border:1px solid #dce3eb;border-radius:8px;background:#fbfcfe;"><div style="font-weight:bold;font-size:14px;color:#17365d;">{safe}</div>')
              elif line.lstrip().startswith("Motivo:"):
                  html_parts.append(f'<p style="margin:8px 0 4px;font-size:13px;line-height:1.5;"><b>Motivazione:</b> {html.escape(line.split(":",1)[1].strip())}</p>')
              elif line.lstrip().startswith("Dati:"):
                  html_parts.append(f'<p style="margin:4px 0 2px;padding:8px;background:#f1f4f8;border-radius:5px;font-size:12px;line-height:1.5;">{safe}</p></div>')
              elif line.startswith("Aggiornamento:") or line.startswith("Run:"):
                  html_parts.append(f'<p style="margin:4px 0;color:#5f6368;font-size:12px;">{safe}</p>')
              else:
                  html_parts.append(f'<p style="margin:7px 0;font-size:13px;line-height:1.5;">{safe}</p>')
          html_parts.append("</div></body></html>")
          msg.add_alternative("".join(html_parts), subtype="html")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as server:
              server.login(username, password)
              server.send_message(msg)
          print(f"Email operativa inviata a {recipient}: {status}")
          PY
